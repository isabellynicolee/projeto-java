    <h2>Plano de Saúde - JavaScript Orientado a Objetos</h2>

    <!-- Botão que aloca as classes com valores quaisquer -->
    <input type="button" value="Alocar objetos de exemplo" onclick="alocarObjetos()">
    <hr>

    <!-- Input para a classe Paciente -->
    <h3>Cadastrar Paciente</h3>
    Nome: <input id="pacNome"><br>
    CPF: <input id="pacCpf"><br>
    Endereço: <input id="pacEndereco"><br>
    Tipo sanguíneo: <input id="pacSangue"><br>
    <input type="button" value="Cadastrar Paciente" onclick="cadastrarPaciente()">
    <hr>

    <!-- Input para a classe Medico -->
    <h3>Cadastrar Médico</h3>
    Nome: <input id="medNome"><br>
    CPF: <input id="medCpf"><br>
    CRM: <input id="medCrm"><br>
    Valor da consulta: <input id="medValor"><br>
    <input type="button" value="Cadastrar Médico" onclick="cadastrarMedico()">
    <hr>

    <h3>Resultado:</h3>
    <div id="resultado"></div>

    <script src="classes.js"></script>
